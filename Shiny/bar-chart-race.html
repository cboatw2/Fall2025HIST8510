<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philadelphia LGBTQ Venues - Bar Chart Race</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        #chart {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 1200px;
            margin: 0 auto;
        }
        .bar {
            transition: all 0.3s ease;
        }
        .label {
            font-size: 14px;
            font-weight: 500;
            fill: #333;
        }
        .value {
            font-size: 13px;
            fill: #666;
            font-weight: 500;
        }
        .year-label {
            font-size: 80px;
            font-weight: bold;
            fill: #e0e0e0;
            opacity: 0.5;
        }
        .controls {
            margin: 20px auto;
            text-align: center;
            max-width: 1200px;
        }
        button {
            padding: 12px 24px;
            margin: 0 5px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: steelblue;
            color: white;
            font-weight: 500;
            transition: background 0.2s;
        }
        button:hover {
            background: #4682b4;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        h1 {
            text-align: center;
            color: #333;
            max-width: 1200px;
            margin: 0 auto 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Philadelphia LGBTQ Venues Over Time</h1>
    <div class="subtitle">Cumulative count of venues by type (1970-1973)</div>
    <div class="controls">
        <button id="play">▶ Play</button>
        <button id="pause" disabled>⏸ Pause</button>
        <button id="reset">↺ Reset</button>
    </div>
    <div id="chart"></div>

    <script>
        // Configuration
        const margin = {top: 20, right: 140, bottom: 40, left: 180};
        const width = 1000 - margin.left - margin.right;
        const height = 600 - margin.top - margin.bottom;
        const n = 10; // Number of bars to show
        const duration = 800; // Animation duration per year
        
        // Create SVG
        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // Load and process data
        d3.csv("data_philly.csv").then(data => {
            // Clean and parse data
            data = data.filter(d => d.Year && d.type && d.Year.trim() !== '');
            data.forEach(d => {
                d.Year = +d.Year;
                d.type = d.type.split(',')[0].trim(); // Take first type if multiple
            });

            // Get unique years and sort
            const years = Array.from(new Set(data.map(d => d.Year))).sort(d3.ascending);
            
            if (years.length === 0) {
                document.body.innerHTML = '<h1 style="text-align:center;color:red;">No valid data found</h1>';
                return;
            }

            // Build cumulative data
            const cumulativeData = [];
            const runningTotals = new Map();

            years.forEach(year => {
                // Get venues for this year
                const yearVenues = data.filter(d => d.Year === year);
                
                // Update running totals
                yearVenues.forEach(venue => {
                    const type = venue.type;
                    runningTotals.set(type, (runningTotals.get(type) || 0) + 1);
                });

                // Save snapshot for this year
                runningTotals.forEach((count, type) => {
                    cumulativeData.push({
                        year: year,
                        type: type,
                        count: count
                    });
                });
            });

            // Scales
            const x = d3.scaleLinear()
                .range([0, width]);

            const y = d3.scaleBand()
                .domain(d3.range(n))
                .range([0, height])
                .padding(0.1);

            // Color scale
            const types = Array.from(new Set(data.map(d => d.type)));
            const color = d3.scaleOrdinal()
                .domain(types)
                .range(d3.schemeTableau10);

            // Add year label
            const yearLabel = svg.append("text")
                .attr("class", "year-label")
                .attr("x", width - 20)
                .attr("y", height - 30)
                .attr("text-anchor", "end");

            let currentYearIndex = 0;
            let isPlaying = false;
            let interval;

            const playButton = d3.select("#play");
            const pauseButton = d3.select("#pause");
            const resetButton = d3.select("#reset");

            function updateChart(year) {
                // Get top N types for this year
                const yearData = cumulativeData
                    .filter(d => d.year === year)
                    .sort((a, b) => b.count - a.count)
                    .slice(0, n);

                // Update scales
                const maxCount = d3.max(yearData, d => d.count) || 0;
                x.domain([0, maxCount * 1.1]);

                // Update year label
                yearLabel.text(year);

                // DATA JOIN
                const bars = svg.selectAll(".bar")
                    .data(yearData, d => d.type);

                const labels = svg.selectAll(".label")
                    .data(yearData, d => d.type);

                const values = svg.selectAll(".value")
                    .data(yearData, d => d.type);

                // ENTER + UPDATE bars
                bars.enter()
                    .append("rect")
                    .attr("class", "bar")
                    .attr("x", 0)
                    .attr("height", y.bandwidth())
                    .attr("fill", d => color(d.type))
                    .merge(bars)
                    .transition()
                    .duration(duration)
                    .ease(d3.easeLinear)
                    .attr("y", (d, i) => y(i))
                    .attr("width", d => x(d.count));

                // EXIT bars
                bars.exit()
                    .transition()
                    .duration(duration)
                    .attr("width", 0)
                    .remove();

                // ENTER + UPDATE labels
                labels.enter()
                    .append("text")
                    .attr("class", "label")
                    .attr("x", -5)
                    .attr("text-anchor", "end")
                    .text(d => d.type)
                    .merge(labels)
                    .transition()
                    .duration(duration)
                    .ease(d3.easeLinear)
                    .attr("y", (d, i) => y(i) + y.bandwidth() / 2 + 5);

                // EXIT labels
                labels.exit()
                    .transition()
                    .duration(duration)
                    .attr("opacity", 0)
                    .remove();

                // ENTER + UPDATE values
                values.enter()
                    .append("text")
                    .attr("class", "value")
                    .attr("text-anchor", "start")
                    .merge(values)
                    .transition()
                    .duration(duration)
                    .ease(d3.easeLinear)
                    .attr("x", d => x(d.count) + 5)
                    .attr("y", (d, i) => y(i) + y.bandwidth() / 2 + 5)
                    .tween("text", function(d) {
                        const i = d3.interpolateNumber(this._current || 0, d.count);
                        this._current = d.count;
                        return function(t) {
                            this.textContent = Math.round(i(t));
                        };
                    });

                // EXIT values
                values.exit()
                    .transition()
                    .duration(duration)
                    .attr("opacity", 0)
                    .remove();
            }

            function play() {
                if (isPlaying) return;
                isPlaying = true;
                playButton.attr("disabled", true);
                pauseButton.attr("disabled", null);
                
                interval = setInterval(() => {
                    if (currentYearIndex >= years.length) {
                        pause();
                        return;
                    }
                    updateChart(years[currentYearIndex]);
                    currentYearIndex++;
                }, duration + 50);
            }

            function pause() {
                isPlaying = false;
                clearInterval(interval);
                playButton.attr("disabled", null);
                pauseButton.attr("disabled", true);
            }

            function reset() {
                pause();
                currentYearIndex = 0;
                updateChart(years[0]);
            }

            // Button event listeners
            playButton.on("click", play);
            pauseButton.on("click", pause);
            resetButton.on("click", reset);

            // Initialize with first year
            updateChart(years[0]);
        }).catch(error => {
            console.error("Error loading data:", error);
            document.body.innerHTML = '<h1 style="text-align:center;color:red;">Error loading data_philly.csv</h1>';
        });
    </script>
</body>
</html>
